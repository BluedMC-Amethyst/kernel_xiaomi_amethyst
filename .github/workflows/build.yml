name: Build BluedMC kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel source branch/tag in this repo'
        default: 'kernel'
      lto:
        description: 'LTO mode'
        type: choice
        options: [full, thin, default]
        default: full
      release_tag:
        description: 'Create a pre-release with this tag (empty = artifacts only)'
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TOP: ${{ github.workspace }}/ws
      DIST: ${{ github.workspace }}/dist
      KERNEL_REPO: https://github.com/${{ github.repository }}
      KERNEL_REF: ${{ inputs.kernel_ref }}
      LTO: ${{ inputs.lto }}
      AVB_KEY: ''
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: Swap (full LTO links need memory)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3 kmod binutils zip lz4 libssl-dev
          mkdir -p ~/.bin && curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo && chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.name "BluedMC CI"; git config --global user.email "ci@users.noreply.github.com"

      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Setup Kleaf workspace
        run: bash repo/scripts/build.sh setup

      - name: Build
        run: JOBS=$(nproc) bash repo/scripts/build.sh build

      - name: KMI gate (stock HyperOS 3 module imports)
        run: bash repo/scripts/build.sh gate

      - name: Package
        run: bash repo/scripts/build.sh pack

      - uses: actions/upload-artifact@v4
        with:
          name: BluedMC-${{ github.run_number }}
          path: dist/*

      - name: Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          rel=$(cat dist/uname.txt)
          printf 'Kernel: `%s`\n\nKMI gate: passed against the stock HyperOS 3 vendor_boot / vendor_dlkm / system_dlkm imports.\n\nSee README for flashing and rollback.\n' "$rel" > notes.md
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS dist/config.txt \
            --repo "${{ github.repository }}" --prerelease --title "BluedMC $TAG" --notes-file notes.md --target "$KERNEL_REF"
